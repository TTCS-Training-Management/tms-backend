<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">
    <h2>Đăng ký tài khoản</h2>
    <p>Nhập email bất kỳ để tạo tài khoản mới trong hệ thống.</p>

    <form method="POST">
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Nhập email của bạn (ví dụ: ban_be@gmail.com)"
            required
        >

        <label for="password">Mật khẩu</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Nhập mật khẩu (tối thiểu 8 ký tự)"
            required
        >

        <button type="submit">Đăng ký ngay</button>
    </form>

    {% if success %}
        <div class="message" style="background-color: #d1fae5; color: #065f46; border: 1px solid #34d399;">
            {{ success }}
            <br><br>
            <a href="/" style="color: #047857; font-weight: bold; text-decoration: underline;">👉 Đến trang Quên mật khẩu để kiểm tra</a>
        </div>
    {% endif %}

    {% if error %}
        <div class="message" style="background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171;">
            {{ error }}
        </div>
    {% endif %}

    <div style="margin-top: 20px; text-align: center;">
        <a href="/" style="color: #4f46e5; text-decoration: underline; font-size: 14px;">Quay lại trang Quên mật khẩu</a>
    </div>
</div>

</body>
</html>
