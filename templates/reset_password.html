<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <title>Đặt lại mật khẩu</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

<div class="container">

    <h2>Đặt lại mật khẩu</h2>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">

        <label>Mật khẩu mới</label>

        <input
            type="password"
            name="password"
            required
        >


        <label>Nhập lại mật khẩu</label>

        <input
            type="password"
            name="confirm_password"
            required
        >


        <button type="submit">

            Đặt lại mật khẩu

        </button>

    </form>

</div>

</body>

</html>
