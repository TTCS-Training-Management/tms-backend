
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SCRUM-100 | Quản lý thông báo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h2>Hệ thống quản lý đào tạo</h2>
        <nav>
            <a href="{{ url_for('index') }}">Thông báo</a>
            <a href="{{ url_for('create') }}">Tạo thông báo</a>
            <a href="{{ url_for('student_view', student_id=1) }}">Học viên mẫu</a>
        </nav>
    </header>
    <main>
        {% for message in get_flashed_messages() %}
            <p class="message">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
